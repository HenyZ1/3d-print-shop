<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0A12"/>
      <stop offset="1" stop-color="#14102A"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#6C3CE9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6C3CE9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#6C3CE9" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M90 0 V630 M180 0 V630 M270 0 V630 M360 0 V630 M450 0 V630 M540 0 V630 M630 0 V630 M720 0 V630 M810 0 V630 M900 0 V630 M990 0 V630 M1080 0 V630"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(90, 86)">
    <rect width="64" height="64" rx="16" fill="url(#grad)"/>
    <g transform="translate(20, 20)" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 6 V2 a1 1 0 0 1 1-1 h12 a1 1 0 0 1 1 1 V6"/>
      <path d="M4 13 a2 2 0 0 1-2-2 V8 a2 2 0 0 1 2-2 h16 a2 2 0 0 1 2 2 v3 a2 2 0 0 1-2 2"/>
      <rect x="5" y="11" width="14" height="9" rx="1"/>
    </g>
    <text x="84" y="44" font-family="'Space Grotesk', Arial, sans-serif" font-size="34" font-weight="700" fill="#F5F5FA">
      Micron<tspan fill="url(#grad)">Forge</tspan>
    </text>
  </g>

  <!-- headline -->
  <text x="90" y="300" font-family="'Space Grotesk', Arial, sans-serif" font-size="74" font-weight="700" fill="#F5F5FA" letter-spacing="-2">
    Figür, maket, prototip
  </text>
  <text x="90" y="384" font-family="'Space Grotesk', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2">
    <tspan fill="url(#grad)">mikron seviyede.</tspan>
  </text>

  <!-- subtitle -->
  <text x="92" y="446" font-family="'Inter', Arial, sans-serif" font-size="28" fill="#A9A9C2">
    SLA reçine 3D baskı · Manisa &amp; İzmir
  </text>

  <!-- stats chips -->
  <g font-family="'Space Grotesk', Arial, sans-serif">
    <g transform="translate(90, 500)">
      <rect width="170" height="64" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="30" font-size="26" font-weight="700" fill="#fff">16K</text>
      <text x="20" y="52" font-size="14" fill="#9595AE">MSLA</text>
    </g>
    <g transform="translate(280, 500)">
      <rect width="170" height="64" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="30" font-size="26" font-weight="700" fill="#fff">25μ</text>
      <text x="20" y="52" font-size="14" fill="#9595AE">Katman</text>
    </g>
    <g transform="translate(470, 500)">
      <rect width="200" height="64" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="20" y="30" font-size="26" font-weight="700" fill="#fff">48 saat</text>
      <text x="20" y="52" font-size="14" fill="#9595AE">Teslim</text>
    </g>
  </g>

  <!-- decorative figure -->
  <g transform="translate(940, 315)" opacity="0.95">
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="url(#grad)" fill-opacity="0.18" stroke="url(#grad)" stroke-width="2"/>
    <polygon points="0,-150 130,-75 0,0 -130,-75" fill="url(#grad)" fill-opacity="0.55"/>
    <polygon points="0,0 130,-75 130,75" fill="url(#grad)" fill-opacity="0.3"/>
    <polygon points="0,0 130,75 0,150" fill="url(#grad)" fill-opacity="0.42"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#fff" stroke-opacity="0.15" stroke-width="1.5"/>
  </g>
</svg>
